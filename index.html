<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- status bar = page top: --nebel-base of src/styles/tokens.css per theme (src/lib/nebel.ts keeps it in sync) -->
    <meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e120f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Erbse" />
    <meta name="application-name" content="Erbse" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- opaque, full-bleed PNG: iOS rounds the corners itself -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Erbse</title>
    <script>
      // Appearance before first paint (see src/lib/theme.ts): no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('fixkosten-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
