<!doctype html>
<html lang="de-AT" data-splash>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- status bar = page top: --nebel-base of src/styles/tokens.css per theme, filled in by the build
         (src/lib/bootSplash.ts); src/lib/nebel.ts keeps it in sync with the chosen appearance -->
    <meta name="theme-color" content="%BOOT_THEME_LIGHT%" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="%BOOT_THEME_DARK%" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Erbse" />
    <meta name="application-name" content="Erbse" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- opaque, full-bleed PNG: iOS rounds the corners itself -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- iOS start images of the installed app (scripts/make-startup-images.mjs, from the start screen below) -->
    <!-- boot:startup-images -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Erbse</title>
    <!-- the start screen's stylesheet, inline: base colour, mesh and logo before anything has loaded -->
    <!-- boot:css -->
    <script>
      // Appearance before first paint (see src/lib/theme.ts): no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('fixkosten-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Start screen and loading animation (layout inline above, motion in src/index.css, exit in
         src/lib/entrance.ts). Static and visible from the first paint: the base colour, the mesh of the
         Monat screen and the flat logo (three overlapping peas, the app icon's geometry). When the app
         starts (src/main.tsx: .splash-live) the same peas wave in place until the data is there, then
         fly into the sidebar logo or fade. Only transform and opacity. -->
    <div id="splash" aria-hidden="true">
      <div class="splash-bg"><div class="splash-mesh"></div></div>
      <div class="splash-stage">
        <svg class="splash-mark" viewBox="5.6 10.6 16.8 6.8" focusable="false">
          <circle cx="9" cy="14" r="3.4" fill="currentColor" />
          <circle cx="14" cy="14" r="3.4" fill="currentColor" opacity=".85" />
          <circle cx="19" cy="14" r="3.4" fill="currentColor" opacity=".7" />
        </svg>
      </div>
    </div>
    <script>
      // never stay forever when the app script fails to load (a slow first load keeps the logo longer)
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s && !s.classList.contains('splash-live')) s.remove();
      }, 15000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
