<!doctype html>
<html lang="de-AT" data-splash>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- status bar = page top: --nebel-base of src/styles/tokens.css per theme (src/lib/nebel.ts keeps it in sync) -->
    <meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e120f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Erbse" />
    <meta name="application-name" content="Erbse" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- opaque, full-bleed PNG: iOS rounds the corners itself -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Erbse</title>
    <script>
      // Appearance before first paint (see src/lib/theme.ts): no flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('fixkosten-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Lade-Animation at app start: visible before the JavaScript has loaded, styles in src/index.css,
         faded out by src/lib/entrance.ts as soon as the data is there (no minimum duration).
         Three Soft-3D peas pop in one after another, then bob in a wave until then. -->
    <div id="splash" aria-hidden="true">
      <svg class="splash-mark" width="84" height="84" viewBox="0 0 28 28">
        <defs>
          <radialGradient id="splash-pea-1" cx=".36" cy=".32" r=".75" fx=".32" fy=".28"><stop offset="0" style="stop-color: var(--splash-glint)" /><stop offset=".5" style="stop-color: var(--pea-1)" /><stop offset="1" style="stop-color: var(--splash-rim)" /></radialGradient>
          <radialGradient id="splash-pea-2" cx=".36" cy=".32" r=".75" fx=".32" fy=".28"><stop offset="0" style="stop-color: var(--splash-glint)" /><stop offset=".5" style="stop-color: var(--pea-2)" /><stop offset="1" style="stop-color: var(--splash-rim)" /></radialGradient>
          <radialGradient id="splash-pea-3" cx=".36" cy=".32" r=".75" fx=".32" fy=".28"><stop offset="0" style="stop-color: var(--splash-glint)" /><stop offset=".5" style="stop-color: var(--pea-3)" /><stop offset="1" style="stop-color: var(--splash-rim)" /></radialGradient>
        </defs>
        <g class="splash-bob"><circle class="splash-pea" cx="8.5" cy="14" r="3.6" fill="url(#splash-pea-1)" /></g>
        <g class="splash-bob"><circle class="splash-pea" cx="14" cy="14" r="3.4" fill="url(#splash-pea-2)" /></g>
        <g class="splash-bob"><circle class="splash-pea" cx="19.3" cy="14" r="3.2" fill="url(#splash-pea-3)" /></g>
      </svg>
    </div>
    <script>
      // never stay in front of the app (e.g. when the script below fails to load)
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) s.remove();
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
